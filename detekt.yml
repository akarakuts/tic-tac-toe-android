build:
  maxIssues: 0

config:
  validation: true

processors:
  active: true

console-reports:
  active: true

comments:
  active: false

complexity:
  active: true
  LongParameterList:
    active: true
    functionThreshold: 11
    constructorThreshold: 12
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 35
    thresholdInObjects: 15
  LongMethod:
    active: true
    threshold: 200
  CyclomaticComplexMethod:
    active: true
    threshold: 30
  NestedBlockDepth:
    active: false

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - Composable
  MatchingDeclarationName:
    active: false

style:
  active: true
  MaxLineLength:
    active: true
    maxLineLength: 140
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    active: false
  MayBeConst:
    active: false
  LoopWithTooManyJumpStatements:
    active: false

potential-bugs:
  active: true

performance:
  active: true

coroutines:
  active: true

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: false

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
